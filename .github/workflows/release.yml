name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Muralis.slnx -c Release

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/Muralis.App/Muralis.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -o publish/win-x64

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zip = "Muralis-$version-win-x64.zip"
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip
          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Muralis-*-win-x64.zip
          generate_release_notes: true
          draft: false
          body: |
            ## Muralis ${{ github.ref_name }}

            A modern wallpaper studio for Windows 10 & 11.

            **Install:** download the zip below, extract it anywhere and run `Muralis.exe`.
            No installer and no .NET runtime installation required.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
